[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattwatch"
version = "1.0.0"
description = "See what your always-on computer really costs - live watts, money, waste and CO2 in a neon dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psutil>=5.9",
  "py-cpuinfo>=9.0",
  "nvidia-ml-py>=12.535",
  "pystray>=0.19",
  "Pillow>=10.0",
]

[project.optional-dependencies]
kasa = ["python-kasa>=0.7"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
wattwatch = "wattwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["wattwatch*"]

[tool.setuptools.package-data]
wattwatch = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
